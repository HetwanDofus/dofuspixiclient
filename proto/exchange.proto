syntax = "proto3";

package dofus;

import "common.proto";


// ============================================================================
// EXCHANGE PROTOCOL (E prefix) - Trading, crafting, shops, big store
// ============================================================================

// --- Server -> Client ---

// ER - Exchange request response.
//
// Pushed to **both** parties of a player-to-player trade, which is why
// it names them separately: canonical `Exchange.onRequest` splits
// `<initiator>|<target>|<type>` and works out "the distant one" as
// whichever of the two is not the reader. Each side then shows a
// different box — the initiator an "En attente..." with a Cancel, the
// target a yes/no — and neither can tell which it is from a single id.
//
// For an NPC exchange `target_id` is the NPC's sprite id and
// `initiator_id` the player's.
message ExchangeRequest {
  bool   success = 1;
  string initiator_id = 2;
  string target_id = 3;
  int32  exchange_type = 4;   // ExchangeType enum
  // Populated on failure only. A refusal reason in this server's own
  // vocabulary ("already-exchanging", "different-map"...), not 1.29's
  // single letters; the client maps it to a message.
  string error_code = 5;
  // The two names, which 1.29 does not send: its client reads them out
  // of `Sprites.getItemAt(id).name`. Ours carries them because both
  // places that need one — the proposal box and the offer pane's header
  // — are HUD components with no route to the sprite registry, and
  // because a sprite that has not been drawn yet has no name to read.
  string initiator_name = 6;
  string target_name = 7;
}

// EC - Exchange create (craft). StarLoco SocketManager.java:1194
// GAME_SEND_EXCHANGE_CONFIRM_OK sends "EC"+<type>. On failure the
// Java client reads an error code appended after "EC".
message ExchangeCreate {
  bool   success = 1;
  int32  exchange_type = 2;   // Populated on success.
  string error_code = 3;      // Populated on failure.
}

// Ec - Craft result. StarLoco SocketManager.java:1484 sends "Ec"+<str>;
// <str> is a single-letter result ("S"=success, "E"=error, ...).
message ExchangeCraft {
  bool   success = 1;
  string result_code = 2;    // "S", "E", "O" (oops/fumble), etc.
}

// EK - Exchange ready
// EK - Exchange ready.
//
// `player_id` is **whose** flag changed, not "the other one":
// `Exchange.onReady` compares it with the local player's id to pick
// which of the two `readyStates` slots to write. Sent to both sides on
// every change, including the reader's own.
message ExchangeReady {
  bool   is_ready = 1;       // charAt(0) == "1"
  string player_id = 2;      // substr(1)
}

// EV - Exchange leave.
//
// `completed` is 1.29's `sExtraData == "a"`: `onLeave` shows
// "Echange effectue" when it is set and "Echange annule" otherwise.
// The frame itself is idempotent either way — canonical `onLeave`
// unloads every exchange window it can find, whichever was open.
message ExchangeLeave {
  bool success = 1;
  bool completed = 2;
}

// EM - Local movement in exchange
message ExchangeLocalMovement {
  bool   success = 1;
  oneof movement {
    ExchangeItemMovement item = 2;
    ExchangeKamaMovement kama = 3;
  }
}

// Em - Distant player movement in exchange
message ExchangeDistantMovement {
  bool   success = 1;
  oneof movement {
    ExchangeItemMovement item = 2;
    ExchangeKamaMovement kama = 3;
  }
}

// Er - Cooperative craft movement
message ExchangeCoopMovement {
  bool   success = 1;
  oneof movement {
    ExchangeItemMovement item = 2;
    ExchangeKamaMovement kama = 3;
  }
}

// Ep - Pay movement
message ExchangePayMovement {
  bool   success = 1;
  oneof movement {
    ExchangeItemMovement item = 2;
    ExchangeKamaMovement kama = 3;
  }
}

// Es - Storage movement
message ExchangeStorageMovement {
  bool   success = 1;
  oneof movement {
    ExchangeItemMovement item = 2;
    ExchangeKamaMovement kama = 3;
  }
}

// Ei - Player shop movement
message ExchangePlayerShopMovement {
  bool   success = 1;
  oneof movement {
    ExchangeItemMovement item = 2;
    ExchangeKamaMovement kama = 3;
  }
}

// Shared item movement sub-message.
//
// Carries a whole `ItemData` rather than the loose fields the 1.29 wire
// string uses. This protocol is a re-typing of 1.29's semantics, not a
// copy of its encoding, and every other item on it — `ItemAdd`,
// `ItemChange`, `AccountStats` — already travels as `ItemData`, which
// the client knows how to render. See QA-104.
//
// `item.quantity` is **absolute, not a delta**: canonical
// `Exchange.onStorageMovement` replaces the entry it finds
// (`ExtendedArray.updateItem`) rather than adding to it, and appends
// when it finds none. On a removal (`add = false`) only `item.unic_id`
// is meaningful.
message ExchangeItemMovement {
  bool     add = 1;
  ItemData item = 2;
  // Unit price, for a shop or a stall. Zero everywhere else.
  int64    price = 3;
}

// Shared kama movement
message ExchangeKamaMovement {
  int64 quantity = 1;
}

// EW - Public mode toggle. Java client reads "EW[+/-]" — boolean.
message ExchangePublicMode {
  bool enabled = 1;
}

// Ee - Mount storage. StarLoco SocketManager.java:1608 sends
// "Ee"+<c>+<s>; c is the operation sign, s the mount descriptor list
// as a legacy list of Mount.parse() entries.
message ExchangeMountStorage {
  string operation = 1;              // "+", "-", "~" sign character.
  repeated MountDescriptor mounts = 2;
}

message MountDescriptor {
  int32  mount_id = 1;
  int32  model = 2;
  string name = 3;
  int32  level = 4;
  int32  sex = 5;
  int64  xp = 6;
}

// Ef - Mount park exchange transfer. StarLoco SocketManager.java:513
// GAME_SEND_Ef_MOUNT_TO_ETABLE sends "Ef"+<c>+<list> where c is
// '+'/'-'/'O' describing stable↔park transfer direction.
message ExchangeMountPark {
  string operation = 1;
  repeated MountDescriptor mounts = 2;
}

// Ew - Mount pods. StarLoco SocketManager.java:483 sends
// "Ew<pods>|<podsMax>".
message ExchangeMountPods {
  int32 pods = 1;
  int32 pods_max = 2;
}

// EL - The full contents of the container that was just opened.
//
// Mandatory, and it must follow `EC`. `dofus.datacenter.Storage` does
// not allocate its inventory array in `initialize()`, so until an `EL`
// lands `Temporary.Storage.inventory` is undefined and every `Es`
// movement is silently dropped by `onStorageMovement`
// (`_loc6_.push(...)` on undefined is a no-op in AS2). `onList` is the
// only place that ever assigns it.
//
// An empty container is a bare `EL` — the client builds an empty array
// and the window opens correctly.
//
// A craft or auction listing is a different shape (a line id, a price
// per lot) and will need its own message; this one is the storage form.
message ExchangeList {
  repeated ItemData items = 1;
  // The container's own kamas. Absolute.
  int64             kamas = 2;
}

// ES - Sell response.
//
// `error_code` is this server's own vocabulary ("bad-type", "no-slot",
// "no-tax"...), not 1.29's numbered errors: the client maps it to the
// sentence its lang bundle already carries. Without it a refusal is a
// bare `false` and the window has to invent a reason — which is worse
// than saying nothing, because the invented one is usually wrong.
message ExchangeSell {
  bool   success = 1;
  string error_code = 2;
}

// EB - Buy response. Same shape, same reasoning.
message ExchangeBuy {
  bool   success = 1;
  string error_code = 2;
}

// Eq - Ask offline exchange
message ExchangeAskOffline {
  int32 time_remaining = 1;
  int64 kd_value = 2;
  int32 quantity = 3;
}

// --- Big Store messages ---

// EHL - Big store type items list. StarLoco SocketManager.java:1885
// sends "EHL"+<categ>+"|"+<templateIds;-separated>.
message ExchangeBigStoreTypeItems {
  int32          category = 1;
  repeated int32 template_ids = 2;
}

// EHM - Big store type items movement. Delta form of EHL; typically a
// single template add/remove.
message ExchangeBigStoreMovement {
  bool  add = 1;
  int32 category = 2;
  int32 template_id = 3;
}

// EHl - Big store item list. StarLoco SocketManager.java:1866 sends
// "EHl"+<templateId>+"|"+<line;...> where each line is "lineId;stats;
// p1;p2;p3;templateId".
message ExchangeBigStoreItemList {
  int32                        template_id = 1;
  repeated BigStoreListingLine lines = 2;
}

// One row of the price grid.
//
// `line_id` names a **group**, not always a single listing. For an item
// whose stats vary — equipment, a weapon, a pet — every exemplar is its
// own group and only `price_qty1` is set. For a generic resource the
// group is the template, and the three prices are the cheapest lot of
// each size currently on sale, which may well come from three different
// sellers: that is what `bigstore/BigStorePriceItem.as` draws, three
// independently buyable prices sharing one `oItem.id`. `EHB` therefore
// names a price by group **and** amount, and the server resolves which
// actual lot that is.
message BigStoreListingLine {
  int64  line_id = 1;
  int32  template_id = 2;
  reserved 3;                 // was `string stats`; see `item` below.
  int64  price_qty1 = 4;      // 0 = absent.
  int64  price_qty10 = 5;
  int64  price_qty100 = 6;
  // The exemplar this row stands for, effects included — the buyer's
  // item card opens on it. A whole `ItemData` rather than 1.29's packed
  // stats string for the reason QA-104 gives: every other item on this
  // protocol travels as `ItemData`, and the client already renders one.
  ItemData item = 7;
}

// EHm - Big store items movement. StarLoco SocketManager.java:1842/1847
// — "EHm-<id>" for delete, "EHm+<lineId>|<tpl>|<stats>|p1|p10|p100"
// for add.
//
// **This server does not emit it.** A generic item's row is a group of
// interchangeable lots named after the cheapest one in it, so its id
// changes as soon as that lot is bought or undercut — and an upsert
// keyed on the id then leaves the stale row standing beside the new one.
// `BigStoreFlow` resends the whole `EHl` instead; a price grid is a
// handful of rows, and it cannot drift. Kept declared because a future
// server that gives each group a row of its own could use it.
message ExchangeBigStoreItemMovement {
  bool                add = 1;
  int64               line_id = 2;   // Delete: only this is populated.
  BigStoreListingLine line = 3;      // Add: full line (line.line_id == line_id).
}

// EHK - the parameters of the auction house that just opened.
//
// 1.29 packs these into `EC` itself: `Exchange.as:439-467` splits
// `<q1,q2,q3>;<types>;<taxe>;<niveauMax>;<objetsMax>;<npcId>;<durée>`
// out of the create frame's extra data. `ExchangeCreate` here carries
// only success/type/error_code and serves all eighteen exchange types,
// so these travel beside it rather than being piled into it — the same
// split `ExchangeList` already makes for a storage's contents.
//
// Sent immediately after `EC`, and before anything else.
message ExchangeBigStoreParams {
  // The three standard lots. Always 1, 10, 100 — sent rather than
  // assumed because the client indexes into this list: `EHB` names a
  // lot by its 1-based position here, not by its size.
  repeated int32 lot_sizes = 1;
  // The `item_types.id` this hall accepts. Its whole specialisation.
  repeated int32 types = 2;
  // Listing tax, in percent of the lot price. The client previews it as
  // `max(1, round(price * tax / 100))` while the seller types a price.
  double tax_percent = 3;
  int32  level_max = 4;
  // Simultaneous listings allowed **per account** in this hall.
  int32  max_items = 5;
  // The vendor's sprite id, so "Mode vente" / "Mode achat" can re-open
  // the other mode against the same NPC without a second click on it.
  int32  npc_id = 6;
  int32  sell_time_hours = 7;
  // The names of `types`, positionally. 1.29 reads them out of its own
  // `items` lang bundle; this server already resolves a type's name for
  // every `ItemTemplateData` it sends, and a hall's category dropdown
  // has to be filled before a single template has arrived for it.
  repeated string type_names = 8;
}

// One of your own lots, as "Stock en magasin" lists it.
//
// `ExchangeList` is the storage form and carries bare `ItemData`; a lot
// also has a price and a size, and its line id is what withdrawing it
// names. This is the shape that message's own docblock said an auction
// listing would need.
message BigStoreOwnListing {
  int64    line_id = 1;
  // The stock in full, effects included: the seller's item card opens on
  // it, and a listed exemplar keeps the jet it was rolled with.
  ItemData item = 2;
  int32    lot_size = 3;
  int64    price = 4;
}

// EHo - every lot you currently have on sale in this hall. Sent on
// opening the sell mode, like `EL` for a storage.
message ExchangeBigStoreOwnList {
  repeated BigStoreOwnListing listings = 1;
}

// EHO - one lot of yours appeared or went away.
message ExchangeBigStoreOwnMovement {
  bool               add = 1;
  int64              line_id = 2;   // Removal: only this is populated.
  BigStoreOwnListing listing = 3;   // Addition: the full lot.
}

// EHP - Big store middle price
message ExchangeBigStoreMiddlePrice {
  int32 item_id = 1;
  int64 average_price = 2;
}

// EHS - Big store search result. Returns matching listings for a
// specific template+type combination.
message ExchangeBigStoreSearch {
  int32                        template_id = 1;
  repeated BigStoreListingLine lines = 2;
}

// EJ - Crafter list for a job. StarLoco emits "EJ"+<list> where list is
// ";"-joined crafter records.
message ExchangeCrafterList {
  int32                   job_id = 1;
  repeated CrafterSummary crafters = 2;
}

message CrafterSummary {
  int64  player_id = 1;
  string name = 2;
  int32  level = 3;
  int32  min_level = 4;
  bool   free_slots = 5;
}

// EA - Craft loop. StarLoco SocketManager.java:1479 sends "EA"+<str>;
// <str> carries the remaining iteration count and item id.
message ExchangeCraftLoop {
  int32 remaining = 1;
  int32 item_id = 2;
}

// Ea - Craft loop end. StarLoco SocketManager.java:1474 sends "Ea"+<str>
// where <str> is typically the final counter echo.
message ExchangeCraftLoopEnd {
  int32 total_crafted = 1;
  int32 item_id = 2;
}

// ============================================================================
// CLIENT -> SERVER EXCHANGE MESSAGES
// ============================================================================

// Client sends ER<type>|<id>|<cellNum>
message ExchangeRequestSend {
  int32  exchange_type = 1;
  string target_id = 2;    // NPC ID or player ID
  int32  cell_num = 3;     // Optional cell number
}

// Client sends EA
message ExchangeAccept {}

// Client sends EK
message ExchangeSetReady {}

// Client sends EMO[+/-]<itemId>|<quantity>|<price>
//
// `add` is the direction: `+` moves into the container, `-` takes out.
//
// The id is an **instance** id, not a template. 1.29 sends `oItem.ID`,
// and `dofus.datacenter.Item`'s constructor is `Item(nID, nUnicID, ...)`
// where `nID` is the instance and `nUnicID` the template — the two
// names are the wrong way round in the original, which is exactly why
// this field spells out which one it is.
// In an auction house this frame means something different in each
// direction, exactly as it does in 1.29 where `BigStoreSell` calls the
// same `movementItems`:
//
//   - `add = true` puts a lot on sale. `item_unic_id` is a stack in the
//     seller's bag, `quantity` is the **lot size** (1, 10 or 100 — not
//     an amount to move), and `price` is the price of the whole lot.
//   - `add = false` takes a lot off sale, and `item_unic_id` is then a
//     **listing id**, not an item id at all.
//
// That inversion is invisible at the call site and has nowhere else to
// be written down, which is why it is written down here.
message ExchangeMoveItem {
  bool  add = 1;
  int32 item_unic_id = 2;
  int32 quantity = 3;
  int64 price = 4;          // Optional (for shop/store)
}

// Client sends EMG<quantity>
message ExchangeMoveKama {
  int64 quantity = 1;
}

// Client sends EP<garbage>O[+/-]<itemId>|<qty>|<price>
message ExchangeMovePayItem {
  bool  add = 1;
  int32 item_id = 2;
  int32 quantity = 3;
  int64 price = 4;
}

// Client sends EP<garbage>G<quantity>
message ExchangeMovePayKama {
  int64 quantity = 1;
}

// Client sends ES<itemId>|<quantity>
message ExchangeSellRequest {
  int32 item_id = 1;
  int32 quantity = 2;
}

// Client sends EB<itemId>|<quantity>
message ExchangeBuyRequest {
  int32 item_id = 1;
  int32 quantity = 2;
}

// Client sends EV
message ExchangeLeaveRequest {}

// Client sends Eq
message ExchangeAskOfflineRequest {}

// Client sends EQ
message ExchangeOfflineRequest {}

// Client sends Es<npcId>
message ExchangeShopRequest {
  int32 npc_id = 1;
}

// Client sends EW[+/-]
message ExchangeSetPublicMode {
  bool enabled = 1;
}

// Client sends EHT<typeId>
message ExchangeBigStoreTypeRequest {
  int32 type_id = 1;
}

// Client sends EHl<unicId>
message ExchangeBigStoreItemListRequest {
  int32 unic_id = 1;
}

// Client sends EHM<monsters>
message ExchangeBigStoreSoulListRequest {
  string monsters = 1;
}

// Client sends EHB<itemId>|<qtyIndex>|<price>
message ExchangeBigStoreBuyRequest {
  int32 item_id = 1;
  int32 quantity_index = 2;
  int64 price = 3;
}

// Client sends EHS<type>|<unicId>
message ExchangeBigStoreSearchRequest {
  int32 type = 1;
  int32 unic_id = 2;
}

// Client sends EJF<jobId>
message ExchangeGetCrafterRequest {
  int32 job_id = 1;
}

// Client sends EL
message ExchangeReplayCraft {}

// Client sends EMR<count>
message ExchangeRepeatCraft {
  int32 count = 1;
}

// Client sends EMr
message ExchangeStopRepeatCraft {}

// Client sends EHP<itemId>
message ExchangeGetMiddlePrice {
  int32 item_id = 1;
}

// --- Mount storage operations ---

// Client sends Erp, Erg, Erc, ErC, Efp, Efg, Eff, Erf<mountId>
message ExchangeMountOperation {
  enum MountOp {
    MOUNT_OP_UNSPECIFIED = 0;
    RIDE_TO_PARK = 1;       // Erp
    RIDE_TO_STABLE = 2;     // Erg
    RIDE_TO_CERTIFICATE = 3; // Erc
    CERTIFICATE_TO_RIDE = 4; // ErC
    PARK_TO_STABLE = 5;     // Efp (free park)
    STABLE_TO_PARK = 6;     // Efg (free stable)
    FREE_PARK_FREE = 7;     // Eff
    FREE_TO_RIDE = 8;       // Erf
  }
  MountOp operation = 1;
  int32   mount_id = 2;
}
