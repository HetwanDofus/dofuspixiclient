syntax = "proto3";

package dofus;


// ============================================================================
// COMMON TYPES - Shared across the entire Dofus 1.29 protocol
// ============================================================================
// The DofusMessage (server->client) wrapper is in server_messages.proto
// The ClientMessage (client->server) wrapper is in client_messages.proto

// ============================================================================
// COMMON SUB-MESSAGES
// ============================================================================

// Generic success/error wrapper used by many responses
message ResultResponse {
  bool success = 1;
  string error_code = 2;  // Single-char error code from original protocol
  string error_data = 3;  // Additional error information
}

// Stat entry: base, items, debuffs, boosts, additional
message StatEntry {
  int32 base = 1;
  int32 items = 2;
  int32 debuffs = 3;
  int32 boosts = 4;
  int32 additional = 5;  // Optional 5th field
}

// Alignment info block
message AlignmentInfo {
  int32 alignment = 1;      // 0=neutral, 1=bontarian, 2=brakmarian, 3=mercenary
  int32 grade = 2;
  int32 rank = 3;
  int32 rank_value = 4;
  int32 disgrace = 5;
  bool  enabled = 6;
  // Fake alignment (when using alignment change items)
  int32 fake_alignment = 7;
}

// RGB color triplet (hex-encoded in original protocol)
message CharacterColors {
  int32 color1 = 1;  // -1 = default
  int32 color2 = 2;
  int32 color3 = 3;
}

// Item effect entry (hex-encoded in original: effectID#p1#p2#p3#p4)
message ItemEffect {
  int32  effect_type = 1;
  int32  param1 = 2;
  int32  param2 = 3;
  int32  param3 = 4;
  string param4 = 5;       // String param (dice notation, text, etc.)
}

// Full item data (parsed from ~-separated hex format)
message ItemData {
  int32           item_id = 1;      // Template ID (hex in original)
  int32           unic_id = 2;      // Unique instance ID (hex in original)
  int32           quantity = 3;     // Stack size (hex in original)
  int32           position = 4;    // Equipment slot (-1 = inventory)
  repeated ItemEffect effects = 5;
  string          effects_raw = 6;  // Raw compressed effects string for passthrough
}

// Area-of-effect shape for spells. Values must stay in sync with the
// canonical definition in packages/grid/src/area.ts (AreaKind).
enum AreaKind {
  AREA_KIND_NONE          = 0;
  AREA_KIND_CROSS         = 1;
  AREA_KIND_PERP_CROSS    = 2;
  AREA_KIND_LINE          = 3;
  AREA_KIND_DIAGONAL_LINE = 4;
  AREA_KIND_RING          = 5;
  AREA_KIND_SQUARE        = 6;
  AREA_KIND_CIRCLE        = 7;
  AREA_KIND_SECTOR        = 8;
}

// Spell data sent to the client so it can fully render + preview a spell
// before casting. Fields 1-6 match the original compressed "Sp" frame;
// fields 7+ expose the targeting + cooldown flags the server uses to
// validate a cast so the client can gate its UI without a round-trip.
message SpellData {
  int32 spell_id = 1;
  int32 level = 2;
  int32 position = 3;   // Hotbar position (encoded via base64 compression)
  int32 ap_cost = 4;    // Action points needed to cast at this level
  int32 range_min = 5;  // Minimum cast range in cells (0 = self / adjacent)
  int32 range_max = 6;  // Maximum cast range in cells

  // Targeting flags, lifted from the spell_levels row for this level.
  bool     line_of_sight    = 7;
  bool     modifiable_range = 8;   // PO boosts apply to range_max
  bool     empty_cell       = 9;   // Target cell must be empty
  bool     line_only        = 10;  // Cast restricted to caster's cardinal lines
  int32    cast_per_turn    = 11;  // 0 = unlimited
  int32    cast_per_target  = 12;  // 0 = unlimited
  int32    cooldown         = 13;  // Turns before the spell can be recast
  int32    critical_rate    = 14;  // 1/x chance of critical at this level
  int32    failure_rate     = 15;  // 1/x chance of failure at this level

  // Shape of the primary effect's area (first non-critical effect).
  // The client uses this together with area_size to draw the AoE
  // preview on hover without resolving the full effect list.
  AreaKind area_kind        = 16;
  int32    area_size        = 17;
  int32    target_mask      = 18;  // Bitmask of legal target kinds.

  // True when the primary effect spawns a persistent ground entity
  // (trap, glyph) or a creature (summon). For these spells the
  // hover preview shows ONLY the placement cell — area_kind/area_size
  // describe the spawned entity's trigger / aura, not a cast-time AOE.
  bool     single_target_spawn = 23;

  // Character level at which this spell is learned — `spell_levels`
  // level 1's `min_player_level`, the same datum 0048 read to build
  // `class_spells.learn_level`. The spell book orders on it: 1.29 lists
  // a book in the order the spells were obtained, and `position` cannot
  // stand in for that any more now that dragging the hotbar rewrites it.
  int32    learn_level = 24;

  // Localized display info, resolved server-side from @dofus/dofus-lang.
  // Ships in the SpellList on enter-game so the HUD doesn't need a second
  // round-trip (or client-side lang bundle) to render tooltips + grid.
  string name         = 19;
  string description  = 20;

  // NOTE: icon_sprite + icon_color fields (21, 22) were removed. The asset
  // pipeline now composes the full 3-layer tinted icon at build time, keyed
  // directly by spell_id (`/assets/dofassets/spells/icons/<spell_id>.dofasset`).
  // The client has everything it needs from `spell_id` above.
  reserved 21, 22;
  reserved "icon_sprite", "icon_color";
}

// Guild emblem
message GuildEmblem {
  int32 back_id = 1;
  int32 back_color = 2;
  int32 symbol_id = 3;
  int32 symbol_color = 4;
}

// Accessory entry for character appearance
message Accessory {
  int32 item_id = 1;      // Item template ID (hex in original)
  int32 skin_id = 2;      // Alternate skin (optional)
  int32 ordinal = 3;      // Slot ordinal
}

// Character restrictions bitmask (base-36 encoded in original)
enum RestrictionFlag {
  RESTRICTION_NONE = 0;
  CANNOT_ASSAULT = 1;          // bit 0
  CANNOT_CHALLENGE = 2;        // bit 1
  CANNOT_EXCHANGE = 4;         // bit 2
  CANNOT_ATTACK = 8;           // bit 3
  FORCE_WALK = 16;             // bit 4
  IS_SLOW = 32;                // bit 5
  CANNOT_CREATURE_MODE = 64;   // bit 6
  IS_TOMB = 128;               // bit 7
  ADMIN_SONIC_SPEED = 256;     // bit 8
}

// Exchange types
enum ExchangeType {
  EXCHANGE_SHOP = 0;
  EXCHANGE_PLAYER = 1;
  EXCHANGE_NPC_SHOP = 2;
  EXCHANGE_CRAFT_PLAYER = 3;
  EXCHANGE_CRAFT_CLIENT = 4;
  EXCHANGE_PLAYER_SHOP = 5;
  EXCHANGE_STORAGE = 6;
  EXCHANGE_SHOP_MODIFIER = 7;
  EXCHANGE_TAX_COLLECTOR = 8;
  EXCHANGE_SECURE_STORAGE = 9;
  EXCHANGE_BIGSTORE_SELL = 10;
  EXCHANGE_BIGSTORE_BUY = 11;
  EXCHANGE_SECURE_CRAFT_CLIENT = 12;
  EXCHANGE_SECURE_CRAFT_ARTISAN = 13;
  EXCHANGE_MOUNT_PARK = 14;
  EXCHANGE_NPC_RESURECTION = 15;
  EXCHANGE_NPC_RESURECTION_PET = 16;
  EXCHANGE_MOUNT_CERTIFICATE = 17;
  EXCHANGE_RUNE_TRADE = 18;
}

// Fight types
enum FightType {
  FIGHT_TYPE_UNSPECIFIED = 0;
  FIGHT_TYPE_CHALLENGE = 1;
  FIGHT_TYPE_AGGRESSION = 2;
  FIGHT_TYPE_PVP = 3;
  FIGHT_TYPE_MIXED_PVM_PVP = 4;
  FIGHT_TYPE_TAX_COLLECTOR = 5;
  FIGHT_TYPE_PRISM = 6;
}

// Character class/breed IDs
enum CharacterClass {
  CLASS_UNSPECIFIED = 0;
  CLASS_FECA = 1;
  CLASS_OSAMODAS = 2;
  CLASS_ENUTROF = 3;
  CLASS_SRAM = 4;
  CLASS_XELOR = 5;
  CLASS_ECAFLIP = 6;
  CLASS_ENIRIPSA = 7;
  CLASS_IOP = 8;
  CLASS_CRA = 9;
  CLASS_SADIDA = 10;
  CLASS_SACRIEUR = 11;
  CLASS_PANDAWA = 12;
}

// Sprite types in movement messages
enum SpriteType {
  SPRITE_TYPE_UNSPECIFIED = 0;
  SPRITE_TYPE_CHARACTER = 1;       // -1 in original
  SPRITE_TYPE_MONSTER = 2;         // -2
  SPRITE_TYPE_MONSTER_GROUP = 3;   // -3
  SPRITE_TYPE_NPC = 4;             // -4
  SPRITE_TYPE_OFFLINE_CHAR = 5;    // -5
  SPRITE_TYPE_TAX_COLLECTOR = 6;   // -6
  SPRITE_TYPE_MUTANT = 7;          // -7/-8
  SPRITE_TYPE_PARK_MOUNT = 9;      // -9
  SPRITE_TYPE_PRISM = 10;          // -10
}

// Chat channel types. The letters are the 1.29 wire symbols, transcribed from
// the decompiled client (assets/sources/client-code/dofus/aks/Chat.as) — the
// earlier mapping had $ and % swapped and no party channel at all.
enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0;
  CHAT_CHANNEL_GENERAL = 1;       // *
  CHAT_CHANNEL_TEAM = 2;          // #
  CHAT_CHANNEL_GUILD = 3;         // %
  CHAT_CHANNEL_ALIGNMENT = 4;     // !
  CHAT_CHANNEL_RECRUITMENT = 5;   // ?
  CHAT_CHANNEL_TRADE = 6;         // :
  // Deprecated: the retail alignment channel is CHAT_CHANNEL_ALIGNMENT. Kept so
  // the field numbers stay stable; never emitted.
  CHAT_CHANNEL_PVP = 7 [deprecated = true];
  CHAT_CHANNEL_ADVICE = 8;        // i
  CHAT_CHANNEL_DATING = 9;        // ^ (Incarnam, the newbie channel)
  CHAT_CHANNEL_EVENT = 10;        // e
  CHAT_CHANNEL_WHISPER_FROM = 11; // F
  CHAT_CHANNEL_WHISPER_TO = 12;   // T
  CHAT_CHANNEL_ADMIN = 13;        // @
  CHAT_CHANNEL_PARTY = 14;        // $
}

// Element types for damage/effects
enum Element {
  ELEMENT_UNSPECIFIED = 0;
  ELEMENT_NEUTRAL = 1;
  ELEMENT_EARTH = 2;
  ELEMENT_FIRE = 3;
  ELEMENT_WATER = 4;
  ELEMENT_AIR = 5;
}

// Game server lifecycle state — mirrors the legacy Dofus 1.29 server list
// discriminator. Also persisted as game_servers.state (smallint) so the DB
// column, the proto field, and the authd use-case share one source of truth.
enum ServerState {
  SERVER_STATE_OFFLINE = 0;
  SERVER_STATE_ONLINE  = 1;
  SERVER_STATE_SAVING  = 2;
  SERVER_STATE_FULL    = 3;
}
