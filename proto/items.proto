syntax = "proto3";

package dofus;


import "common.proto";

// ============================================================================
// ITEMS / INVENTORY PROTOCOL (O prefix)
// ============================================================================

// --- Server -> Client ---

// Oa - Accessories update for a sprite
message ItemAccessories {
  string sprite_id = 1;
  repeated Accessory accessories = 2;
}

// OD - Drop item response.
// StarLoco fork does not emit; legacy 1.29 clients expect "OD" as a simple
// success/error ack (K/E suffix handled by the bool). No payload body.
message ItemDrop {
  bool success = 1;
}

// OA - Add items (inventory receive)
// Items are separated by *, each prefixed with type char: O=item, G=gold
message ItemAdd {
  bool success = 1;
  repeated ItemData items = 2;
  int64 kama_received = 3;   // When type is G
}

// OC - Item change (stats change, quantity, etc.)
message ItemChange {
  bool success = 1;
  repeated ItemData items = 2;
}

// OR - Remove item from inventory
message ItemRemove {
  int32 item_unic_id = 1;
}

// OQ - Quantity update
message ItemQuantity {
  int32 item_unic_id = 1;
  int32 new_quantity = 2;
}

// OM - Item movement (equip/unequip)
message ItemMovement {
  int32 item_unic_id = 1;
  int32 position = 2;
}

// OT - Tool update (job tool equipped).
// StarLoco SocketManager.java:197-202 — `"OT"` when unequipped, `"OT" + id`
// when a tool is equipped (id > 0 => has_tool=true, id==0 => has_tool=false).
message ItemTool {
  int32 tool_item_id = 1;   // 0 when no tool equipped
  bool  has_tool = 2;
  // Which job the tool belongs to; 0 when there is none. Not in 1.29,
  // which never needed it: its client greys a harvest on the criterion
  // string alone (`J?V:-`, "does the player have the job") and lets the
  // server answer "NO_TOOL_JOB" in the chat afterwards. Ours greys the
  // action instead, and to do that it has to know *whose* tool this is —
  // `jobs_data.tools` is server-side data with no client counterpart.
  int32 job_id = 3;
}

// Ow - Weight (pods) update
message ItemWeight {
  int32 current_weight = 1;
  int32 max_weight = 2;
}

// OS - Item set bonus update
message ItemSet {
  // Set ID and list of active items in the set
  int32 set_id = 1;
  repeated int32 item_ids = 2;
  repeated ItemEffect set_effects = 3;
}

// OK - Item use condition response.
// Legacy 1.29: "OK<conditionExpr>" (pipe-separated condition tokens) shown
// when the client tried to equip/use an item whose conditions aren't met.
// Not emitted by StarLoco fork; kept typed for future use.
message ItemUseCondition {
  string condition_expression = 1;  // e.g. "PO>20&PX>10"
}

// OF - Item found (loot notification).
// Legacy 1.29: "OF<itemId>|<quantity>" announces an item picked up from a
// monster loot. Not emitted by StarLoco fork; kept typed.
message ItemFound {
  int32 item_template_id = 1;
  int32 quantity = 2;
}

// Od - Item deletion confirmation
message ItemDeletion {
  int32 item_unic_id = 1;
}

// (custom, no 1.29 equivalent) — presentation data for the templates a
// player currently owns (bag + equipped). The retail client shipped
// items.json itself and read templates straight out of it; this server
// resolves item presentation the same way it already resolves spells —
// server-side — so the browser never has to load the full ~11 000-item
// bundle. Sent once after ItemAdd on entering the game, and again
// whenever a new template a player has never owned before is granted.
message ItemTemplateData {
  int32           id = 1;
  string          name = 2;
  string          description = 3;
  int32           type_id = 4;
  string          type_name = 5;
  int32           super_type = 6;
  int32           level = 7;
  int32           weight = 8;
  int32           gfx_id = 9;
  bool            usable = 10;
  bool            targetable = 11;
  bool            two_handed = 12;
  int32           item_set_id = 13;
  repeated int32  positions = 14;   // legal equipment positions, from the item's superType
  string          criteria = 15;
}

message ItemTemplates {
  repeated ItemTemplateData templates = 1;
}

// --- Inventory Shortcuts ---

// OrA - Shortcut added.
//
// `object_id` is a *template* id, not the unic id of one stack. A
// shortcut outlives the stack it was created from: 1.29's
// `InventoryShortcutItem.findRealItem()` rescans the inventory for any
// stack of the same template on every render, and greys the slot out
// when it finds none. Pinning a unic id would delete the shortcut the
// moment its last potion is drunk.
message InventoryShortcutAdd {
  int32 position = 1;     // Hotbar slot, 1-based
  int32 object_id = 2;    // Item template ID
}

// OrR - Shortcut removed
message InventoryShortcutRemove {
  int32 position = 1;
}

// ============================================================================
// CLIENT -> SERVER ITEMS MESSAGES
// ============================================================================

// Client sends OM<itemId>|<position>|<quantity>
message ItemMoveRequest {
  int32 item_unic_id = 1;
  int32 position = 2;       // Equipment slot (-1 = unequip to inventory)
  int32 quantity = 3;        // Optional, for stackable items
}

// Client sends OD<itemId>|<quantity>
message ItemDropRequest {
  int32 item_unic_id = 1;
  int32 quantity = 2;
}

// Client sends OU<itemId><spriteId><cellNum>|<quantity>
message ItemUseRequest {
  int32  item_unic_id = 1;
  string sprite_id = 2;     // Optional target sprite
  int32  cell_num = 3;      // Optional target cell
  int32  quantity = 4;
}

// Client sends Ou<itemId>  (use item on self, lowercase variant)
message ItemUseSelfRequest {
  int32 item_unic_id = 1;
}

// Client sends Od<itemId>|<quantity>
message ItemDestroyRequest {
  int32 item_unic_id = 1;
  int32 quantity = 2;
}

// Client sends Ox<itemId>|<position>
message ItemDissociateRequest {
  int32 item_unic_id = 1;
  int32 position = 2;
}

// Client sends Os<itemId>|<position>|<skinId>
message ItemSetSkinRequest {
  int32 item_unic_id = 1;
  int32 position = 2;
  int32 skin_id = 3;
}

// Client sends Of<itemId>|<position>|<feededItemId>
message ItemFeedRequest {
  int32 item_unic_id = 1;
  int32 position = 2;
  int32 feeded_item_unic_id = 3;
}

// Client sends Ol<itemId>,<lock>,<days>
message ItemLockRequest {
  int32 item_unic_id = 1;
  bool  lock = 2;
  int32 days = 3;            // Optional lock duration
}

// Client sends OR<itemId>
message ItemReinitializeRequest {
  int32 item_unic_id = 1;
}

// --- Inventory Shortcut Client Messages ---

// Client sends OrA<position>;<objectId>
//
// Here `object_id` is the *unic* id of the dragged stack — 1.29's
// `MouseShortcuts.drop` sends `oCursor.ID`, the real item's id. The
// server resolves it to a template before storing, which is what comes
// back on the `InventoryShortcutAdd` frame.
message InventoryShortcutAddRequest {
  int32 position = 1;
  int32 object_id = 2;
}

// Client sends OrM<oldPos>;<newPos>
message InventoryShortcutMoveRequest {
  int32 old_position = 1;
  int32 new_position = 2;
}

// Client sends OrR<position>
message InventoryShortcutRemoveRequest {
  int32 position = 1;
}
