[package]
name = "swf-spike"
version = "0.1.0"
edition = "2024"

# ---------------------------------------------------------------
# Bins kept for development + regression checking. Others were
# removed during the rewrite cleanup — git history has them if
# you ever need an old probe.
# ---------------------------------------------------------------

[[bin]]
name = "dump-export"
path = "src/bin/dump_export.rs"
# Inspect a single SWF export: timeline ops, depths, char IDs.

[[bin]]
name = "render-tile"
path = "src/bin/render_tile.rs"
# Render one tile (frame 0) to PNG.

[[bin]]
name = "render-tile-sheet"
path = "src/bin/render_tile_sheet.rs"
# Render N frames of a tile to a horizontal sheet — used to verify
# morph + slope animations (e.g. tile 343 chimney smoke).

[[bin]]
name = "classify-map-tiles"
path = "src/bin/classify_map_tiles.rs"
# For each tile id on a map, report animated/random/slope kind.

[[bin]]
name = "render-player-tinted"
path = "src/bin/render_player_tinted.rs"
# Render a player export with three palettes side-by-side to
# verify HSL applyColor zone recolor.

[[bin]]
name = "render-avm1-sheet"
path = "src/bin/render_avm1_sheet.rs"
# Render every frame of an AVM1-driven spell SWF to a sheet —
# regression check for the AVM1 emulator (spell 802 et al).

[[bin]]
name = "dump-place"
path = "src/bin/dump_place.rs"
# Dump every Place op (incl. filters/color_xform/ratio) for an export
# and recursively into its children. Diagnostic for tiles that hang
# the WASM render path.

[[bin]]
name = "dump-root"
path = "src/bin/dump_root.rs"
# Dump root timeline of a SWF.

[[bin]]
name = "bench-gpu-strip"
path = "src/bin/bench_gpu_strip.rs"
# Native GPU reference for CPU_RENDER_FEASIBILITY.md — composed-actor
# strip bake timed as submit + poll-wait.

[[bin]]
name = "render-spell-icon"
path = "src/bin/render_spell_icon.rs"
# Render a spell icon (back + up trio) to PNG via the same logic as
# the WASM bridge — diagnostic for layer alignment.

[dependencies]
swf = "0.2"
vello = "0.8"
wgpu = "28"
pollster = "0.4"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
flate2 = "1"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
js-sys = "0.3"

