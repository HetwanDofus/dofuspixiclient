[package]
name = "vello-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
dofasset-renderer = { path = "../renderer" }
swf-spike = { path = "../swf-spike" }
vello = "0.8"
vello_encoding = "0.8"
wgpu = { version = "28", features = ["webgpu"] }
wasm-bindgen = "0.2.117"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "HtmlCanvasElement", "OffscreenCanvas", "ImageBitmap"] }
console_error_panic_hook = "0.1"
bytemuck = "1"
# Multi-core scene build (gated; only built for the threaded wasm target,
# which requires +atomics + SharedArrayBuffer + COOP/COEP).
rayon = { version = "1", optional = true }
wasm-bindgen-rayon = { version = "1", optional = true }

[features]
threads = ["dep:rayon", "dep:wasm-bindgen-rayon"]

# wasm-opt (binaryen) mangles atomics/shared-memory unless run with
# --enable-threads, which wasm-pack 0.13 doesn't pass — disable it for
# the threaded build (Rust -O3 + LTO from the profile still apply).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

