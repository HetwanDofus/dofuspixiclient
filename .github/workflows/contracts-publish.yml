name: Publish shared contracts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      registry_url:
        description: Package registry URL
        required: true
        default: https://registry.npmjs.org
        type: string
      dry_run:
        description: Build and verify without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGISTRY_URL: ${{ inputs.registry_url || vars.CONTRACTS_REGISTRY_URL || 'https://registry.npmjs.org' }}
      NODE_AUTH_TOKEN: ${{ secrets.CONTRACTS_NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: ${{ inputs.registry_url || vars.CONTRACTS_REGISTRY_URL || 'https://registry.npmjs.org' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate protobuf contracts
        run: bun run --cwd packages/proto gen

      - name: Refuse uncommitted generated changes
        run: git diff --exit-code -- packages/proto/gen packages/grid/src/version.ts

      - name: Verify installable tarballs
        run: bun run contracts:verify

      - name: Refuse an existing immutable version
        if: github.event_name == 'release' || !inputs.dry_run
        shell: bash
        run: |
          for package_dir in packages/proto packages/grid; do
            package_name=$(node -p "require('./${package_dir}/package.json').name")
            package_version=$(node -p "require('./${package_dir}/package.json').version")
            if npm view "${package_name}@${package_version}" version --registry "${REGISTRY_URL}" >/dev/null 2>&1; then
              echo "::error::${package_name}@${package_version} already exists and cannot be overwritten"
              exit 1
            fi
          done

      - name: Publish exact contract versions
        if: github.event_name == 'release' || !inputs.dry_run
        shell: bash
        run: |
          npm publish --workspace packages/proto --access public --provenance --registry "${REGISTRY_URL}"
          npm publish --workspace packages/grid --access public --provenance --registry "${REGISTRY_URL}"
