name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bunx biome check apps/electrobun/src
        continue-on-error: true

      - name: Type-check (electrobun)
        working-directory: apps/electrobun
        run: bunx tsc --noEmit

      - name: Test (electrobun)
        working-directory: apps/electrobun
        run: bun test

      - name: Build (turbo)
        run: bun run build
        env:
          TURBO_TELEMETRY_DISABLED: 1
