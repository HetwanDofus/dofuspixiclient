services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dofus
      POSTGRES_PASSWORD: dofus
      POSTGRES_DB: dofus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dofus -d dofus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: brings the schema up to date, then exits.
  migrate:
    build: .
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dofus:dofus@postgres:5432/dofus
    restart: "no"

  authd:
    build: .
    command: ["bun", "run", "src/core/main.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      MODE: auth
      DATABASE_URL: postgres://dofus:dofus@postgres:5432/dofus
    volumes:
      - sockets:/sockets

  gamed:
    build: .
    command: ["bun", "run", "src/core/main.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      MODE: game
      DATABASE_URL: postgres://dofus:dofus@postgres:5432/dofus
    volumes:
      - sockets:/sockets

  gateway:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - authd
      - gamed
    environment:
      # Only `POST /admin/accounts` uses this, and only when
      # GATEWAY_ADMIN_TOKEN is set — see apps/gameserver-ts/src/gateway/
      # admin-accounts.ts (QA-126). The gateway opens no other connection.
      DATABASE_URL: postgres://dofus:dofus@postgres:5432/dofus
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
    volumes:
      - sockets:/sockets

volumes:
  pgdata:
  sockets:
